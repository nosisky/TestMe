<svg width="500" height="500" viewBox="0 0 500 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background elements -->
  <circle cx="250" cy="250" r="200" fill="#F0F4FF" opacity="0.5"/>
  <circle cx="250" cy="250" r="120" fill="#E4EAFF" opacity="0.7"/>
  
  <!-- Character -->
  <ellipse cx="250" cy="320" rx="70" ry="10" fill="#D0D8FF" opacity="0.5"/>
  
  <!-- Person sitting -->
  <ellipse cx="250" cy="290" rx="30" ry="40" fill="#7E57FF"/>
  <circle cx="250" cy="235" r="25" fill="#7E57FF"/>
  
  <!-- Arms -->
  <path d="M230 265C220 280 200 290 185 290" stroke="#7E57FF" stroke-width="10" stroke-linecap="round"/>
  <path d="M270 265C280 280 300 290 315 290" stroke="#7E57FF" stroke-width="10" stroke-linecap="round"/>
  
  <!-- Laptop -->
  <rect x="200" y="290" width="100" height="8" rx="2" fill="#555B7B"/>
  <rect x="190" y="298" width="120" height="70" rx="4" fill="#555B7B"/>
  <rect x="195" y="303" width="110" height="60" rx="2" fill="#F8FAFF"/>
  
  <!-- Quiz cards on screen -->
  <rect x="205" y="313" width="90" height="15" rx="2" fill="#7E57FF" opacity="0.2"/>
  <rect x="205" y="333" width="50" height="10" rx="2" fill="#7E57FF" opacity="0.4"/>
  <rect x="205" y="348" width="40" height="10" rx="2" fill="#7E57FF" opacity="0.4"/>
  
  <!-- Floating Quiz Cards -->
  <g transform="translate(330, 200) rotate(15)">
    <rect width="80" height="100" rx="8" fill="white" stroke="#7E57FF" stroke-width="2"/>
    <rect x="10" y="10" width="60" height="10" rx="2" fill="#7E57FF" opacity="0.2"/>
    <rect x="10" y="30" width="40" height="8" rx="2" fill="#7E57FF" opacity="0.4"/>
    <rect x="10" y="45" width="60" height="8" rx="2" fill="#7E57FF" opacity="0.4"/>
    <rect x="10" y="70" width="25" height="20" rx="4" fill="#7E57FF" opacity="0.2"/>
    <rect x="45" y="70" width="25" height="20" rx="4" fill="#7E57FF" opacity="0.6"/>
  </g>
  
  <g transform="translate(130, 180) rotate(-10)">
    <rect width="80" height="100" rx="8" fill="white" stroke="#7E57FF" stroke-width="2"/>
    <rect x="10" y="10" width="60" height="10" rx="2" fill="#7E57FF" opacity="0.2"/>
    <rect x="10" y="30" width="40" height="8" rx="2" fill="#7E57FF" opacity="0.4"/>
    <rect x="10" y="45" width="60" height="8" rx="2" fill="#7E57FF" opacity="0.4"/>
    <rect x="10" y="70" width="25" height="20" rx="4" fill="#7E57FF" opacity="0.6"/>
    <rect x="45" y="70" width="25" height="20" rx="4" fill="#7E57FF" opacity="0.2"/>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="380" cy="120" r="15" fill="#FFB300" opacity="0.5"/>
  <circle cx="120" cy="100" r="10" fill="#7E57FF" opacity="0.3"/>
  <circle cx="400" cy="350" r="8" fill="#7E57FF" opacity="0.3"/>
  <circle cx="100" cy="350" r="12" fill="#FFB300" opacity="0.3"/>
</svg> 